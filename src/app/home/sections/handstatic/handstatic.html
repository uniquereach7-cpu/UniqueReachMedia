<section class="hs" aria-label="Campaign showcase carousel">

  <div class="hs__header">
    <span class="hs__kicker">Creative Portfolio</span>
    <h2 class="hs__title">Campaigns That Move People</h2>
    <p class="hs__sub">
      From bold social campaigns to high-converting digital ads —
      we craft stories that stick.
    </p>
  </div>

  <div class="hs__stage" #stage aria-hidden="true">
    @for (card of cards; track card.id) {
      <div class="hs-card" #cardEl>
        <div class="hs-card__frame">
          <img
            src="assets/screens/screen.webp"
            alt="Campaign poster"
            draggable="false"
          />
        </div>
      </div>
    }
  </div>

</section>
