<section class="services-story" #servicesStory>
  <div class="services-pin">
    <div class="services-stage">
      <div class="services-core">
        <span class="services-core__eyebrow">Our</span>
        <h2>Services</h2>
      </div>

      <div class="orbit-track">
        <article
          class="orbit-item"
          *ngFor="let service of services"
          [style.--angle]="service.angle"
          [style.--tilt]="service.tilt"
        >
          <a [href]="service.href" class="service-card">
            <img
              [src]="service.image"
              [alt]="service.alt"
              class="service-img"
              loading="lazy"
              decoding="async"
            />

            <div class="service-overlay"></div>

            <div class="service-container">
              <h3 class="service-title">{{ service.title }}</h3>

              <div class="service-footer">
                <div class="service-rule" aria-hidden="true"></div>

                <ul class="service-tags" aria-label="Tools">
                  <li class="service-tag" *ngFor="let tag of service.tags">
                    {{ tag }}
                  </li>
                </ul>
              </div>
            </div>
          </a>
        </article>
      </div>
    </div>
  </div>
</section>
