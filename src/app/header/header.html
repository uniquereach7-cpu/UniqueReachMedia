<header class="top-bar" *ngIf="showHeader">
  <div class="top-bar__inner">
    <!-- Left: logo (no background) -->
    <div class="brand">
      <a routerLink="/home" aria-label="Home">
        <img src="assets/logo400.png" alt="Company Logo" class="logo" />
      </a>
    </div>

    <!-- Center: rounded white pill nav -->
    <nav class="main-nav" role="navigation" aria-label="Primary">
      <ul class="main-nav__list">
        <li class="nav-item"><a routerLink="/about-us" (click)="closeMenu()">About Us</a></li>
        <li class="nav-item"><a routerLink="/home" fragment="services" (click)="onFragmentClick('services')">Services</a></li>
        <li class="nav-item"><a routerLink="/our-work" (click)="closeMenu()">Portfolio</a></li>
        <li class="nav-item"><a routerLink="/contact-us" (click)="closeMenu()">Contact Us</a></li>
      </ul>
    </nav>

    <!-- Right: hamburger for small screens -->
    <button
  class="menu-toggle"
  type="button"
  (click)="toggleMenu($event)"
  aria-label="Toggle menu"
  [attr.aria-expanded]="menuOpen">
  <span class="hamburger" aria-hidden="true"></span>
</button>

  </div>

  <!-- Mobile menu (slide down). Use attribute binding for aria-hidden -->
  <nav
  class="mobile-nav"
  [class.open]="menuOpen"
  role="navigation"
  aria-label="Mobile Primary"
  [attr.aria-hidden]="!menuOpen"
>
  <a routerLink="/about-us" (click)="closeMenu()">About Us</a>

  <a routerLink="/home" fragment="services" (click)="onFragmentClick('services')">Services</a>

  <a routerLink="/our-work" (click)="closeMenu()">Portfolio</a>

  <a routerLink="/contact-us" (click)="closeMenu()">Contact Us</a>
</nav>

  <!-- Backdrop shown only when mobile menu is open. Clicking it closes the menu. -->
  <div class="backdrop" *ngIf="menuOpen" (click)="closeMenu()"></div>
</header>
